# Generated from the private release manifest; do not edit target copies.
name: Published binary smoke tests
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release to test
        default: latest
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix: {"include":[{"os":"darwin","arch":"amd64","runner":"macos-15-intel"},{"os":"darwin","arch":"arm64","runner":"macos-15"},{"os":"linux","arch":"amd64","runner":"ubuntu-24.04"},{"os":"linux","arch":"arm64","runner":"ubuntu-24.04-arm"},{"os":"windows","arch":"amd64","runner":"windows-2025"},{"os":"windows","arch":"arm64","runner":"windows-11-arm"}]}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      KIOFCO_VERSION: ${{ github.event.release.tag_name || inputs.version || 'latest' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install and run Unix binary without a language runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export KIOFCO_INSTALL_DIR="$RUNNER_TEMP/kiofco-bin"
          sh ./cli-install.sh
          "$KIOFCO_INSTALL_DIR/kiofco" version
          "$KIOFCO_INSTALL_DIR/kiofco" help
      - name: Install and run Windows binary without a language runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'kiofco-bin'
          ./cli-install.ps1 -Version $env:KIOFCO_VERSION -InstallDir $directory
          & (Join-Path $directory 'kiofco.exe') version
          & (Join-Path $directory 'kiofco.exe') help
